<div class="mits-cn-modal" data-mits-cn-modal>
  <div class="mits-cn-modal-dialog" role="dialog" aria-modal="true"{if $title != ''} aria-labelledby="mits-cn-modal-title-{$notice_id}"{/if}>
    {if $dismissible}<button type="button" class="mits-cn-close" data-mits-cn-close aria-label="{$label_close}">&times;</button>{/if}
    {if $title != ''}<div class="mits-cn-title" id="mits-cn-modal-title-{$notice_id}">{$title}</div>{/if}
    {if $content != ''}<div class="mits-cn-content">{$content}</div>{/if}
    {if $countdown}<div class="mits-cn-countdown" data-mits-cn-countdown data-end="{$end_timestamp}" data-days="{$label_days}" data-hours="{$label_hours}" data-minutes="{$label_minutes}" data-seconds="{$label_seconds}"></div>{/if}
    {if $button_text != '' && $button_url != ''}<div class="mits-cn-actions"><a class="mits-cn-button" href="{$button_url}">{$button_text}</a></div>{/if}
  </div>
</div>
